<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflection + Speculation Worksheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: system-ui, sans-serif;
  background:#111;
  color:#eee;
  padding:20px;
}
.question {
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
  margin-bottom:18px;
  background:#181818;
}
textarea {
  width:100%;
  min-height:60px;
  background:#000;
  color:#fff;
  border:1px solid #333;
  border-radius:6px;
  padding:8px;
}
.responses {
  margin-top:8px;
  font-size:0.8rem;
  color:#aaa;
}
button {
  margin:4px 6px 12px 0;
  padding:6px 12px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Reflection + Speculation Worksheet</h1>
<div id="anonLabel"></div>

<div id="questions"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* -------------------------
   Firebase Config
--------------------------*/

const firebaseConfig = {
  apiKey: "AIzaSyAUhFwBjZjVolme4MyLaMAE1gz1RpTPE-o",
  authDomain: "art104presentation1.firebaseapp.com",
  projectId: "art104presentation1",
  storageBucket: "art104presentation1.firebasestorage.app",
  messagingSenderId: "83591855087",
  appId: "1:83591855087:web:13fae6dcda649eb2df541a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* -------------------------
   Anonymous ID
--------------------------*/

function generateID() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

let anonID = localStorage.getItem("anonID");
if (!anonID) {
  anonID = generateID();
  localStorage.setItem("anonID", anonID);
}

document.getElementById("anonLabel").textContent =
  `Your anonymous ID: ${anonID}`;

/* -------------------------
   Build Questions
--------------------------*/

const container = document.getElementById("questions");

for (let i = 1; i <= 24; i++) {

  const div = document.createElement("div");
  div.className = "question";

  div.innerHTML = `
    <h3>Presentation ${i}</h3>
    <textarea id="text-${i}" placeholder="Write one sentence..."></textarea><br>
    <button onclick="submitAnswer(${i})">Submit</button>
    <div class="responses" id="responses-${i}"></div>
  `;

  container.appendChild(div);
  listenForResponses(i);
}

/* -------------------------
   Submit Answer (WITH ERROR HANDLING)
--------------------------*/

window.submitAnswer = async function(num) {

  const text = document.getElementById(`text-${num}`).value.trim();
  if (!text) return alert("Please write something first.");

  try {

    await addDoc(collection(db, "responses"), {
      questionNumber: num,
      text,
      anonID,
      timestamp: Date.now()
    });

    console.log("Document successfully written.");
    document.getElementById(`text-${num}`).value = "";

  } catch (error) {

    console.error("Error writing document:", error);
    alert("Error saving response. Check console for details.");
  }
};

/* -------------------------
   Live Responses (WITH ERROR HANDLING)
--------------------------*/

function listenForResponses(num) {

  try {

    const q = query(
      collection(db, "responses"),
      where("questionNumber", "==", num)
    );

    onSnapshot(q,
      (snapshot) => {

        const box = document.getElementById(`responses-${num}`);
        box.innerHTML = "";

        snapshot.forEach((doc) => {
          const d = doc.data();
          const row = document.createElement("div");
          row.textContent = `${d.anonID}: ${d.text}`;
          box.appendChild(row);
        });
      },
      (error) => {
        console.error("Listener error:", error);
      }
    );

  } catch (error) {
    console.error("Query setup error:", error);
  }
}

/* -------------------------
   Fetch My Responses (DEBUG SAFE)
--------------------------*/

async function getMyResponses() {

  try {

    const q = query(
      collection(db, "responses"),
      where("anonID", "==", anonID)
    );

    const snapshot = await getDocs(q);
    return snapshot.docs.map(d => d.data());

  } catch (error) {
    console.error("Fetch error:", error);
    alert("Error fetching responses. Check console.");
    return [];
  }
}

</script>
</body>
</html>
