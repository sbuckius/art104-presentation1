<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflection + Speculation Worksheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Export Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: system-ui, sans-serif;
  background:#111;
  color:#eee;
  padding:20px;
}

h1 { font-size:1.4rem; }

.instructions {
  max-width:760px;
  color:#ccc;
  margin-bottom:12px;
}

button {
  margin:4px 6px 12px 0;
  padding:6px 12px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}

.question {
  border:1px solid #333;
  border-radius:10px;
  padding:15px;
  margin-bottom:18px;
  background:#181818;
}

.prompt {
  font-size:0.85rem;
  color:#bbb;
  margin:6px 0 10px;
}

.options {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:10px;
}

textarea {
  width:100%;
  min-height:60px;
  background:#000;
  color:#fff;
  border:1px solid #333;
  border-radius:6px;
  padding:8px;
}

.responses {
  margin-top:8px;
  font-size:0.8rem;
  color:#aaa;
}
</style>
</head>

<body>

<h1>Presentation 1: Reflection OR Speculation</h1>

<div class="instructions">
For each presentation, choose ONE question to answer and write one sentence.
You can export all of your answers as a PDF to turn in.
</div>

<div id="anonLabel"></div>

<button id="exportCSV">Export CSV</button>
<button id="exportPDF">Export PDF</button>
<button id="exportPNG">Export PNG</button>

<div id="questions"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  getDocs,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* -------------------------
   Firebase Config
--------------------------*/

const firebaseConfig = {
  apiKey: "AIzaSyAUhFwBjZjVolme4MyLaMAE1gz1RpTPE-o",
  authDomain: "art104presentation1.firebaseapp.com",
  projectId: "art104presentation1",
  storageBucket: "art104presentation1.firebasestorage.app",
  messagingSenderId: "83591855087",
  appId: "1:83591855087:web:13fae6dcda649eb2df541a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* -------------------------
   Question Text
--------------------------*/

const QUESTION_A = `What is one thing in this presentation that you think is interesting and connects to you? It can connect to your interests, your opinions, your lived experience, your feelings, your goals, your creative work. Write one sentence about it.`;

const QUESTION_B = `Write one sentence in which you speculate about an artwork that you could make that is inspired by something in this presentation. What is your speculative artwork?`;

/* -------------------------
   Anonymous ID
--------------------------*/

function generateID() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

let anonID = localStorage.getItem("anonID");
if (!anonID) {
  anonID = generateID();
  localStorage.setItem("anonID", anonID);
}

document.getElementById("anonLabel").textContent =
  `Your anonymous ID: ${anonID}`;

/* -------------------------
   Build Questions
--------------------------*/

const container = document.getElementById("questions");

for (let i = 1; i <= 24; i++) {

  const div = document.createElement("div");
  div.className = "question";

  div.innerHTML = `
    <h3>Presentation ${i}</h3>

    <div class="options">
      <label>
        <input type="radio" name="choice-${i}" value="A">
        <strong>A.</strong> ${QUESTION_A}
      </label>

      <label>
        <input type="radio" name="choice-${i}" value="B">
        <strong>B.</strong> ${QUESTION_B}
      </label>
    </div>

    <textarea id="text-${i}" placeholder="Write one sentence..."></textarea><br>
    <button onclick="submitAnswer(${i})">Submit</button>

    <div class="responses" id="responses-${i}"></div>
  `;

  container.appendChild(div);
  listenForResponses(i);
}

/* -------------------------
   Submit Answer
--------------------------*/

window.submitAnswer = async function(num) {

  const choiceEl = document.querySelector(`input[name="choice-${num}"]:checked`);
  const text = document.getElementById(`text-${num}`).value.trim();

  if (!choiceEl || !text) {
    alert("Please select A or B and write one sentence.");
    return;
  }

  await addDoc(collection(db, "responses"), {
    questionNumber: num,
    choice: choiceEl.value,
    promptText: choiceEl.value === "A" ? QUESTION_A : QUESTION_B,
    text,
    anonID,
    timestamp: Date.now()
  });

  document.getElementById(`text-${num}`).value = "";
};

/* -------------------------
   Live Responses
--------------------------*/

function listenForResponses(num) {

  const q = query(
    collection(db, "responses"),
    where("questionNumber", "==", num),
    orderBy("timestamp")
  );

  onSnapshot(q, (snapshot) => {

    const box = document.getElementById(`responses-${num}`);
    box.innerHTML = "";

    snapshot.forEach((doc) => {
      const d = doc.data();
      const row = document.createElement("div");
      row.textContent = `${d.anonID} (${d.choice}): ${d.text}`;
      box.appendChild(row);
    });
  });
}

/* -------------------------
   Fetch My Responses
--------------------------*/

async function getMyResponses() {

  const q = query(
    collection(db, "responses"),
    where("anonID", "==", anonID),
    orderBy("questionNumber")
  );

  const snapshot = await getDocs(q);
  return snapshot.docs.map(d => d.data());
}

/* -------------------------
   Build Export Layout
--------------------------*/

function buildExportLayout(responses) {

  const wrapper = document.createElement("div");
  wrapper.style.width = "800px";
  wrapper.style.padding = "40px";
  wrapper.style.background = "#fff";
  wrapper.style.color = "#000";
  wrapper.style.fontFamily = "Courier New, monospace";

  responses.forEach(r => {

    const block = document.createElement("div");
    block.style.marginBottom = "20px";

    block.innerHTML = `
      <strong>[Presentation ${r.questionNumber}] (${r.choice})</strong><br>
      <em>${r.promptText}</em><br><br>
      ${r.text}
      <hr>
    `;

    wrapper.appendChild(block);
  });

  return wrapper;
}

/* -------------------------
   PDF Export (Multi Page)
--------------------------*/

document.getElementById("exportPDF").addEventListener("click", async () => {

  const responses = await getMyResponses();
  if (!responses.length) return alert("No responses yet.");

  const layout = buildExportLayout(responses);
  document.body.appendChild(layout);

  const canvas = await html2canvas(layout, { scale: 2 });
  const imgData = canvas.toDataURL("image/png");

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "px", "a4");

  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;

  let heightLeft = imgHeight;
  let position = 0;

  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;

  while (heightLeft > 0) {
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }

  pdf.save(`responses-${anonID}.pdf`);
  layout.remove();
});

/* -------------------------
   PNG Export
--------------------------*/

document.getElementById("exportPNG").addEventListener("click", async () => {

  const responses = await getMyResponses();
  if (!responses.length) return alert("No responses yet.");

  const layout = buildExportLayout(responses);
  document.body.appendChild(layout);

  const canvas = await html2canvas(layout, { scale: 2 });

  const link = document.createElement("a");
  link.download = `responses-${anonID}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();

  layout.remove();
});

/* -------------------------
   CSV Export
--------------------------*/

document.getElementById("exportCSV").addEventListener("click", async () => {

  const responses = await getMyResponses();
  if (!responses.length) return alert("No responses yet.");

  let csv = "Question,Choice,Prompt,Response,AnonymousID\n";

  responses.forEach(r => {
    csv += `${r.questionNumber},${r.choice},"${r.promptText.replace(/"/g,'""')}","${r.text.replace(/"/g,'""')}",${r.anonID}\n`;
  });

  const blob = new Blob([csv], { type:"text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `responses-${anonID}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

</script>
</body>
</html>
